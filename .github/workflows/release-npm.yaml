name: Release

on:
  release:
    types: [ released ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Override version for a test stage, e.g. 1.0.32-stage.0 (staged with dist-tag "test"). Leave empty to stage the package.json version as latest.'
        required: false

permissions:
  contents: read
  id-token: write

jobs:
  maybe-release:
    name: release
    runs-on: ubuntu-latest

    steps:

      - name: Checkout respository
        uses: actions/checkout@v3

      - name: Use Node.js
        uses: actions/setup-node@v3.4.1
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Run compile
        run: npm run build

      - name: Set test version
        if: ${{ inputs.version != '' }}
        run: npm version "$VERSION" --no-git-tag-version
        env:
          VERSION: ${{ inputs.version }}

      - name: Run stage publish
        run: npm stage publish --access public --tag ${{ inputs.version != '' && 'test' || 'latest' }}
